# From the repository folder:
#   conda env create -f environment.yml
#   conda activate spacemap
#   spacemap doctor
#   spacemap
#
# Python 3.10 is required by the current imaging stack: palom needs
# scikit-image <0.20, whose wheels stop at Python 3.10.
# The pinned openslide-python binding needs the OpenSlide 3.x native ABI.
# Conda supplies Python and the matching OpenSlide library. Pip installs
# SPACEMAP and JupyterLab from pyproject.toml in editable mode.
# AI packages and DeepCell are optional; see docs/installation.md.
name: spacemap
channels:
  - conda-forge
dependencies:
  - python=3.10
  - openslide<4
  - pip
  - pip:
      - -e .[notebook]
