[project]
name = "spacemap-ai"
version = "0.3.0"
description = "SPACEMAP: a spatial multiplex imaging pipeline with an optional local-first AI assistant"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Aguilera Lab, UT Southwestern Medical Center" }]
maintainers = [{ name = "Aguilera Lab, UT Southwestern Medical Center" }]
keywords = [
    "spatial-biology",
    "multiplex-imaging",
    "CODEX",
    "cell-segmentation",
    "phenotyping",
    "bioimage-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# The base install runs the complete scientific pipeline and the GUI.  It
# deliberately excludes the AI assistant and the heavier segmentation backend,
# both of which are extras below.
dependencies = [
    # Upper bounds follow palom, which is the tightest constraint in the
    # stack: it requires numpy<2.0 and zarr<2.15. Raising either without
    # raising palom makes the dependency set unsolvable.
    "numpy>=1.24,<2.0",
    "scipy>=1.12.0",
    "pandas>=2.0",
    "Pillow>=9.0.0",
    "toml>=0.10.2",
    "psutil>=5.9.0",
    "tqdm>=4.65.0",
    "joblib>=1.3.0",
    "pyarrow>=14.0",
    # Imaging and I/O
    "tifffile>=2023.7.0",
    "imagecodecs>=2023.3.16",
    "zarr>=2.10,<2.15",
    "opencv-python-headless>=4.11.0.86",
    "scikit-image>=0.19.3",
    "rasterio>=1.4.4",
    "shapely>=2.1.2",
    "geopandas>=0.13.0",
    "palom>=2024.12.1",
    "dask[array]>=2023.1.0",
    # Segmentation (Cellpose pulls torch, which the pipeline also uses)
    "cellpose<4",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    # Single-cell analysis and phenotyping
    "scanpy>=1.9.5",
    "anndata>=0.9.0",
    "scikit-learn>=1.4.0",
    "umap-learn>=0.5.0",
    "leidenalg>=0.10.0",
    "igraph>=0.10.0",
    "minisom>=2.3.6",
    "geosketch",
    "scimap>=2.3.5",
    "combat>=0.3.3",
    "statsmodels>=0.14.0",
    "lifelines>=0.27.0",
    "numba>=0.58",
    # Plotting
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    # GUI
    "streamlit>=1.52.1",
    "streamlit-drawable-canvas>=0.9.3",
    "streamlit-aggrid>=0.3.4",
    "streamlit-plotly-events",
]

[project.optional-dependencies]
# Everything needed to download and run a local model in-process.
# bitsandbytes is Linux/CUDA only; it is skipped elsewhere so the extra still
# installs on macOS and Windows, where models run unquantized or on CPU.
ai = [
    "transformers>=4.45",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "huggingface-hub>=0.24",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
    "bitsandbytes>=0.43; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# A quantized single-file model served through llama.cpp.  This is the
# practical route on a machine with no GPU.
gguf = ["llama-cpp-python>=0.3.0"]

# DeepCell is an alternative segmentation backend.  It is optional because it
# pulls TensorFlow, which is a large and version-sensitive install.
deepcell = ["deepcell; sys_platform != 'darwin' or platform_machine != 'arm64'"]

notebook = [
    "jupyterlab>=4.0.0",
    "jupyter>=1.1.1",
    "ipykernel>=6.25.0",
    "ipywidgets>=8.0.0",
    "nbstripout>=0.7.1",
]

all = ["spacemap-ai[ai,gguf,deepcell,notebook]"]

[project.urls]
Homepage = "https://github.com/AguileraLab/SPACEMAP"
Repository = "https://github.com/AguileraLab/SPACEMAP"
Issues = "https://github.com/AguileraLab/SPACEMAP/issues"
Changelog = "https://github.com/AguileraLab/SPACEMAP/blob/main/CHANGELOG.md"

[project.scripts]
spacemap = "spacemap_gui.launch:main"

[dependency-groups]
dev = [
    "pytest>=7.4.4",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spacemap", "src/spacemap_gui", "src/spacemap_assistant", "src/spacemap_workflows"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "notebooks/",
    "docs/",
    "scripts/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CITATION.cff",
    "marker_configs.json",
    "pyproject.toml",
]

[tool.ruff]
line-length = 120
exclude = ["scimap_ref", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
addopts = "-m \"not integration and not smoke\""
testpaths = ["tests"]
norecursedirs = ["scimap_ref"]
markers = [
    "integration: slower end-to-end tests that require prepared test data",
    "smoke: broad synthetic workflow checks that sit between unit and integration tests",
]
