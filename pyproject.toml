[project]
name = "spacemap-ai"
version = "0.4.0"
description = "SPACEMAP Studio: an interactive spatial multiplex imaging pipeline with optional AI assistance"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Bassel Dawod", email = "basbees@gmail.com" },
    { name = "Todd A. Aguilera", email = "todd.aguilera@utsouthwestern.edu" },
]
maintainers = [{ name = "Bassel Dawod", email = "basbees@gmail.com" }]
keywords = [
    "spatial-biology",
    "multiplex-imaging",
    "CODEX",
    "cell-segmentation",
    "phenotyping",
    "bioimage-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# The base install runs the complete scientific pipeline and the GUI.  It
# deliberately excludes the AI assistant and the heavier segmentation backend,
# both of which are extras below.
dependencies = [
    # Several bounds follow the two tightest packages, stated here so a fresh
    # install resolves to them directly and `pip check` stays clean:
    # - palom (registration): numpy<2, scikit-image<0.20, tifffile<=2024.7.2;
    #   palom 2024.x also zarr<2.15. Every palom from 2025 needs zarr>=2.17,
    #   which scimap forbids, so palom stays at 2024.x.
    # - scimap (Tab 7's SCIMAP method, sm.tl.phenotype_cells): zarr==2.10.3,
    #   tifffile<2024, scipy<=1.12.0, dask<2024, anndata<0.11, llvmlite<0.42.
    # SPACEMAP's tests pass with these versions.
    "numpy>=1.24,<2.0",
    "scipy>=1.12.0",
    "pandas>=2.0",
    "Pillow>=9.0.0",
    "toml>=0.10.2",
    "psutil>=5.9.0",
    "tqdm>=4.65.0",
    "joblib>=1.3.0",
    "pyarrow>=14.0",
    # Imaging and I/O
    "tifffile>=2023.7.0,<2024",
    "imagecodecs>=2023.3.16",
    "zarr>=2.10,<2.15",
    "opencv-python-headless>=4.11.0.86",
    "scikit-image>=0.19.3,<0.20",
    "rasterio>=1.4.4",
    "shapely>=2.1.2",
    "geopandas>=0.13.0",
    # palom 2024.x brings opencv-python next to the headless OpenCV that
    # Cellpose and SPACEMAP use; both come at the same version and pip accepts it.
    "palom>=2024.12.1,<2025",
    "dask[array]>=2023.1.0",
    # Segmentation (Cellpose pulls torch, which the pipeline also uses)
    "cellpose<4",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    # Single-cell analysis and phenotyping
    "scanpy>=1.9.5",
    "anndata>=0.9.0",
    "scikit-learn>=1.4.0",
    "umap-learn>=0.5.0",
    "leidenalg>=0.10.0",
    "igraph>=0.10.0",
    "minisom>=2.3.6",
    "geosketch",
    "scimap>=2.3.5",
    "combat>=0.3.3",
    "statsmodels>=0.14.0",
    "lifelines>=0.27.0",
    "numba>=0.58",
    # Plotting
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    # GUI
    # 1.58 adds st.App, which serves the image viewer's routes on the GUI's own port.
    "streamlit>=1.58",
    # 0.10 and later are rewrites that fail to import with current Streamlit and
    # that Tab 3's canvas patch (ui_utils.patch_canvas_image_to_url) does not fit.
    "streamlit-drawable-canvas>=0.9.3,<0.10",
    "streamlit-aggrid>=0.3.4",
    "streamlit-plotly-events",
]

[project.optional-dependencies]
# Everything needed to download and run a local model in-process.
# bitsandbytes is Linux/CUDA only; it is skipped elsewhere so the extra still
# installs on macOS and Windows, where models run unquantized or on CPU.
ai = [
    # Gemma 4 needs transformers 5 (checked with 5.17 on 2026-09-25).
    "transformers>=5.0",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "huggingface-hub>=0.24",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
    "bitsandbytes>=0.43; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# A quantized single-file model served through llama.cpp.  This is the
# practical route on a machine with no GPU.
gguf = ["llama-cpp-python>=0.3.0"]

# DeepCell is an alternative segmentation backend.  It is optional because it
# pulls TensorFlow, which is a large and version-sensitive install.
deepcell = ["deepcell; sys_platform != 'darwin' or platform_machine != 'arm64'"]

notebook = [
    "jupyterlab>=4.0.0",
    "jupyter>=1.1.1",
    "ipykernel>=6.25.0",
    "ipywidgets>=8.0.0",
    "nbstripout>=0.7.1",
]

all = ["spacemap-ai[ai,gguf,deepcell,notebook]"]

[project.urls]
Homepage = "https://github.com/AguileraLab/SPACEMAP"
Repository = "https://github.com/AguileraLab/SPACEMAP"
Issues = "https://github.com/AguileraLab/SPACEMAP/issues"
Changelog = "https://github.com/AguileraLab/SPACEMAP/blob/main/CHANGELOG.md"

[project.scripts]
spacemap = "spacemap_gui.launch:main"

[dependency-groups]
dev = [
    "pytest>=7.4.4",
    "ruff>=0.5",
    "httpx>=0.27",  # starlette's TestClient, used by the viewer and model-service tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["src/spacemap_gui/tabs/tab7_phenotyping/heatmap_click_selector/frontend/build/**"]
exclude = ["**/node_modules/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/spacemap", "src/spacemap_gui", "src/spacemap_assistant", "src/spacemap_workflows"]

[tool.hatch.build.targets.wheel.force-include]
"marker_configs.json" = "spacemap/marker_configs.json"

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "notebooks/",
    "docs/",
    "scripts/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CITATION.cff",
    "CONTRIBUTING.md",
    "environment.yml",
    "requirements-lock.txt",
    "Dockerfile",
    "docker-compose.yml",
    ".dockerignore",
    "marker_configs.json",
    "pyproject.toml",
]

[tool.ruff]
line-length = 120
exclude = ["scimap_ref", "notebooks"]

[tool.ruff.lint]
# A pragmatic baseline for a large existing codebase: the rules that catch
# real defects -- syntax errors, undefined names, broken comparisons -- rather
# than style. Enabling the full E/W/I/UP/B sets reports several thousand
# findings here, which would make CI fail on every change and train people to
# ignore it. Stricter rules can be adopted a directory at a time.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# False positive. matrix_t and squared_norms are closure variables read by
# _chunk_distances at lines 313 and 322, and only deleted at line 340 once the
# closure has finished. Ruff treats the later `del` as unbinding them for the
# nested function as well.
"src/spacemap/ph_vortex_utils.py" = ["F821"]

# SCIMAP installs pytest-xvfb transitively; these tests need no X server.
[tool.pytest.ini_options]
addopts = "-p no:xvfb -m \"not integration and not smoke\""
testpaths = ["tests"]
norecursedirs = ["scimap_ref"]
markers = [
    "integration: slower end-to-end tests that require prepared test data",
    "smoke: broad synthetic workflow checks that sit between unit and integration tests",
]
