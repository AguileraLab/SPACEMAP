services:
  spacemap:
    build:
      context: .
      args:
        # Add "ai" to bake the AI assistant's dependencies into the image, or
        # "ai,gguf" to include the CPU-friendly llama.cpp backend.
        SPACEMAP_EXTRAS: ""
        SPACEMAP_TORCH_INDEX_URL: ${SPACEMAP_TORCH_INDEX_URL-https://download.pytorch.org/whl/cpu}
    image: spacemap:latest
    ports:
      - "8501:8501"
    shm_size: "2gb"
    # environment:
    #   # Uncomment to force the AI assistant off for every user of this
    #   # deployment. Leave it unset to let them switch it on in Tab 0.
    #   SPACEMAP_ASSISTANT: "off"
    volumes:
      # Your data. Set SPACEMAP_PROJECTS_DIR before 'docker compose up'.
      - ${SPACEMAP_PROJECTS_DIR:-./docker-projects}:/workspace/projects
      # Settings, logs and downloaded models, so they survive a rebuild.
      - spacemap-home:/home/spacemap/.spacemap

    # Uncomment to give the container a GPU.
    # Requires NVIDIA Container Toolkit and a CUDA-enabled image.
    # See docs/installation.md before enabling this block.
    #
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  spacemap-home:
